name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Compilar
        run: cmake --build build --config Release
      - name: Subir plugin
        uses: actions/upload-artifact@v4
        with:
          name: CelesteChoir-VST3
          path: build/CelesteChoir_artefacts/Release/VST3/
